name: Site CI
# Builds the site exactly as the Stanford copy is built, then fails on a broken internal link or a missing key page.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build (Stanford overlay)
        run: JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config_stanford_cs.yml
      - name: Link and key-page check
        run: python3 scripts/check_site.py --dir _site
